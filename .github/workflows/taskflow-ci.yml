name: TaskFlow CI

on:
  push:
    paths:
      - 'projects/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'
  pull_request:
    paths:
      - 'projects/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/taskflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test