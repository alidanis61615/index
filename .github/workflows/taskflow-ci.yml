name: TaskFlow CI

on:
  push:
    paths:
      - 'projects/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'
  pull_request:
    paths:
      - 'projects/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/taskflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name taskflow

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-android-debug
          path: projects/taskflow/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
